# CI for MyTower. Runs on every PR and on pushes to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]   # 3.12 is the floor in pyproject.toml, 3.13 the target
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pytest -q

  lint:
    name: flake8 and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: |
          pip install -r requirements-dev.lock
          pip install -e flake8_max_blank_lines/
      # The console script, not `python -m flake8`: from the repo root, -m puts the
      # flake8_max_blank_lines/ project folder ahead of the installed plugin on sys.path.
      - name: flake8
        run: flake8 mytower/
      # Report only: main has 243 mypy errors. Make blocking when the mypy-to-zero issue lands.
      - name: mypy
        continue-on-error: true
        run: mypy mytower/
