# CI for MyTower. Runs on every PR and on pushes to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]   # 3.12 is the floor in pyproject.toml, 3.13 the target
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pytest -q

  lint:
    name: flake8 and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: |
          pip install -r requirements-dev.lock
          pip install -e flake8-max-blank-lines/
      # The hooks in .pre-commit-config.yaml are the single source of truth for lint, so CI runs
      # exactly what a local commit runs.
      - name: pre-commit (whitespace hooks and flake8)
        run: pre-commit run --all-files --show-diff-on-failure
      # Ratchet: fails if mypy finds more errors than the baseline. Lower the
      # baseline as #162 burns the count down; at 0, drop the ratchet.
      - name: mypy (at most 243 errors, see #162)
        if: ${{ !cancelled() }}  # still report the ratchet when the pre-commit step failed
        shell: bash
        run: |
          set +e
          mypy mytower/ > mypy.txt
          status=$?
          set -e
          tail -n 1 mypy.txt | tee -a "$GITHUB_STEP_SUMMARY"
          test "$status" -le 1        # 0 = clean, 1 = type errors; 2 = mypy itself failed
          count=$(grep -oP '^Found \K[0-9]+' mypy.txt || echo 0)
          test "$count" -le 243
