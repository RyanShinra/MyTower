repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]  # keep deliberate two-space line breaks in Markdown
      - id: end-of-file-fixer
      - id: mixed-line-ending
    #   - id: check-toml
    #   - id: check-yaml
  # flake8 is the only linter. black and ruff format would rewrite blank lines against the
  # X303 rule (see CLAUDE.md, "Style"). `language: system` runs the venv's flake8, which has
  # the flake8_max_blank_lines plugin and flake8-bugbear installed. CI runs this same hook.
  - repo: local
    hooks:
      - id: flake8
        name: flake8 (X303 blank-line plugin, bugbear)
        entry: flake8
        language: system
        types: [python]
        files: ^mytower/  # same scope CI's `flake8 mytower/` always had
